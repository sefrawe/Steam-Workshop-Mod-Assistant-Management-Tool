name: build-linux-packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (onedir)
        run: pyinstaller --noconfirm --clean packaging/linux/SteamWorkshopTool-linux.spec

      - name: Assemble AppDir
        run: |
          set -eux
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/SteamWorkshopTool/* AppDir/usr/bin/
          cp icon/icon.png AppDir/steamworkshoptool.png
          cp icon/icon.png \
             AppDir/usr/share/icons/hicolor/256x256/apps/steamworkshoptool.png
          cat > AppDir/usr/share/applications/steamworkshoptool.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Steam Workshop Mod Assistant
          Name[zh_CN]=Steam 工坊 Mod 助理管理工具
          Exec=SteamWorkshopTool
          Icon=steamworkshoptool
          Terminal=false
          Categories=Utility;
          Comment=Steam Workshop Mod Assistant Management Tool (Linux port)
          EOF
          # appimagetool 只在 AppDir 根目录找 *.desktop（AppImage 规范），
          # usr/share/applications 里的只用于系统集成，必须补一份到根。
          cp AppDir/usr/share/applications/steamworkshoptool.desktop \
             AppDir/steamworkshoptool.desktop
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          DIR=$(dirname "$(readlink -f "$0")")
          exec "$DIR/usr/bin/SteamWorkshopTool" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/SteamWorkshopTool

      - name: Build AppImage
        run: |
          set -eux
          # appimagetool 连续版（curl -f：HTTP 错误即报错，避免静默下载 403 的 HTML）
          curl -fsSL --retry 3 \
            -A 'GitHubActions' \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool
          chmod +x appimagetool
          ls -l appimagetool
          file appimagetool
          head -c 64 appimagetool | od -c | head -n 4
          export ARCH=x86_64
          # 方式1：EXTRACT_AND_RUN 直接跑（免 FUSE）
          if ! APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir SteamWorkshopTool-x86_64.AppImage \
               2>appimagetool1.err; then
            echo "::error::appimagetool 直接运行失败：$(head -n 8 appimagetool1.err | tr '\n' ' ' | cut -c1-500)"
            # 方式2：解包后直跑内部 AppRun，完全绕开 AppImage 运行时
            ./appimagetool --appimage-extract 2>appimagetool2.err || {
              echo "::error::appimagetool 解包失败：$(head -n 8 appimagetool2.err | tr '\n' ' ' | cut -c1-500)"; exit 1; }
            ./squashfs-root/AppRun AppDir SteamWorkshopTool-x86_64.AppImage 2>appimagetool3.err || {
              echo "::error::AppRun 构建失败：$(head -n 8 appimagetool3.err | tr '\n' ' ' | cut -c1-500)"; exit 1; }
          fi
          ls -l SteamWorkshopTool-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            SteamWorkshopTool-x86_64.AppImage
